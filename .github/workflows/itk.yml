name: ITK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ITK_LOG_LEVEL: DEBUG

permissions:
  contents: read

# Only run the latest job
concurrency:
  group: '${{ github.workflow }} @ ${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  itk:
    name: ITK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check if SDK version is SNAPSHOT
        run: |
          SDK_VERSION=$(grep -oP '<version\.sdk>\K[^<]+' pom.xml)
          echo "Detected SDK_VERSION: ${SDK_VERSION}"
          echo "SDK_VERSION=${SDK_VERSION}" >> "$GITHUB_ENV"
          if [[ "${SDK_VERSION}" == *"-SNAPSHOT" ]]; then
            echo "IS_SNAPSHOT=true" >> "$GITHUB_ENV"
          else
            echo "IS_SNAPSHOT=false" >> "$GITHUB_ENV"
          fi

      - name: Checkout a2a-java
        if: env.IS_SNAPSHOT == 'true'
        uses: actions/checkout@v7
        with:
          repository: a2aproject/a2a-java
          path: a2a-java
          persist-credentials: false

      - name: Build a2a-java with Maven, skipping tests
        if: env.IS_SNAPSHOT == 'true'
        run: |
          mvn -B install -DskipTests
        working-directory: a2a-java

      - name: Get a2a-java version and save as env var
        if: env.IS_SNAPSHOT == 'true'
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>&1 | grep -v '\[')
          echo "Detected a2a-java version: ${VERSION}"
          echo "SDK_VERSION=${VERSION}" >> "$GITHUB_ENV"
        working-directory: a2a-java

      - name: Clone a2a-itk
        uses: actions/checkout@v7
        with:
          repository: a2aproject/a2a-itk
          ref: main
          path: itk/a2a-itk

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build itk_service image (GHA layer cache)
        uses: docker/build-push-action@v7
        with:
          context: itk/a2a-itk
          tags: itk_service:latest
          load: true
          cache-from: type=gha,scope=itk_service
          cache-to: type=gha,mode=max,scope=itk_service

      - name: Cache launcher peer-SDK checkouts + build outputs
        uses: actions/cache@v6
        with:
          path: ~/.cache/a2a-itk-launcher
          key: itk-launcher-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            itk-launcher-${{ runner.os }}-

      - name: Run ITK Tests
        run: bash run_itk.sh
        working-directory: itk
        env:
          A2A_ITK_REVISION: main
          ITK_SKIP_BUILD: "1"
          ITK_LOG_LEVEL: DEBUG
          ITK_M2_REPO: ${{ env.IS_SNAPSHOT == 'true' && '/home/runner/.m2/repository' || '' }}

      - name: Upload ITK agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itk-agent-logs
          path: itk/logs/
          if-no-files-found: ignore
